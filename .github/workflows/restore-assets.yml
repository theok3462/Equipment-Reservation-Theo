name: Restore project assets
on:
  push:
    paths:
      - '.github/workflows/restore-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theo/track-b
      - name: Restore binaries from group repository
        run: |
          mkdir -p ctxt gradle/wrapper
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Poudel-Sanskriti/Equipment-Reservation/main/ctxt/SRS_Group9.pdf \
            -o ctxt/SRS_Group9.pdf
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Poudel-Sanskriti/Equipment-Reservation/main/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar
          test -s ctxt/SRS_Group9.pdf
          test -s gradle/wrapper/gradle-wrapper.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctxt/SRS_Group9.pdf gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m "Restore project SRS and Gradle wrapper"
            git push origin HEAD:theo/track-b
          fi
